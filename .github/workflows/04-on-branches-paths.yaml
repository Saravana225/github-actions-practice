# 04 - Trigger filters: branches, tags, and paths
# Don't run on EVERY push — only when it actually matters.
# This saves CI minutes and avoids noisy, irrelevant runs.
#
# RULE: use EITHER `branches` OR `branches-ignore` (not both).
#       Same for `paths`/`paths-ignore` and `tags`/`tags-ignore`.

name: 04 - On Push (filtered)

on:
  push:
    branches:
      - main
    paths:
      - 'sample-app/**'
      - '**.py'

jobs:
  filtered-build:          # Level 1: Under 'jobs:' (2 spaces)
    runs-on: ubuntu-latest # Level 2: Inside job (4 spaces)
    steps:                 # Level 2: Inside job (4 spaces) <--- FIX WAS HERE
      - name: This only runs for the branches/paths above   # Level 3 (6 spaces, '-' at 6)
        run: echo "New: Relevant change detected on branch ${{ github.ref_name }}" # Aligned with 'name:'
