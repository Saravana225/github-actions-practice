# 02 - Trigger: push
# Runs EVERY TIME code is pushed to the repository (any branch).
# This is the most common Continuous Integration trigger.

name: 02 - On Push

on: push   # short form: run on every push to any branch

jobs:
  on-push:
    runs-on: ubuntu-latest
    steps:
      - name: Show what triggered this run
        run: |
          echo "Event name : $GITHUB_EVENT_NAME"   # -> push
          echo "Branch ref : $GITHUB_REF"          # -> refs/heads/<branch>
          echo "Commit SHA : $GITHUB_SHA"
          echo "Pushed by  : $GITHUB_ACTOR"

      - name: Send email notification
        uses: dawidd6/action-send-mail@v4
        with:
          # Mail server settings
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          
          # Authentication via Repository Secrets
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          
          # Email Content
          subject: "New Code Pushed to ${{ github.repository }}"
          to: saravanavijayan@gmail.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            New code was pushed to your repository!
            
            Pushed by: ${{ github.actor }}
            Branch: ${{ github.ref_name }}
            Commit SHA: ${{ github.sha }}
            Commit Link: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
